[project]
name = "docintel"
version = "0.1.0"
description = "AI Document Intelligence for PTC Windchill — backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8,<2",
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.53,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "python-multipart>=0.0.32",
    "pdfplumber>=0.11.10,<0.12",
    "httpx>=0.28,<1",
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "reportlab>=5.0,<6",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls a real LLM provider (skipped unless DOCINTEL_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "RUF012", # pydantic model_config class vars
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]
